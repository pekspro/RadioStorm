name: Build release

on:
  workflow_dispatch:
    inputs:
      productionApiKeys:
        description: 'Use production API keys'
        type: boolean
        default: true
        required: true
      buildWindowsX86:
        description: 'Windows: Build x86'
        type: boolean
        default: true
      buildWindowsX64:
        description: 'Windows: Build x64'
        type: boolean
        default: true
      buildAndroid:
        description: 'Android: Build'
        type: boolean
        default: true
      androidKeepAab:
        description: 'Android: Keep AAB-files'
        type: boolean
        default: false

env:
  SECRETS_FILE: ./Source/Pekspro.RadioStorm.Settings.SynchronizedSettings.FileProvider.Secrets/Secrets-Protected.cs


jobs:
  publish:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: 10.0.x
        
    - name: Install MAUI Workload
      run: dotnet workload install maui --ignore-failed-sources

    - name: Get build information
      run: |
        echo "CURRENT_TIME=$(date +'%Y%m%d_%H%M%S')" >> $env:GITHUB_ENV
        echo "CURRENT_TIME_UTC_STRING=$(date +'%Y-%m-%dT%H:%M:%SZ')" >> $env:GITHUB_ENV
        echo "SHORT_SHA=$("${{ github.sha }}".SubString(0, 8))" >> $env:GITHUB_ENV
        
    - name: Upload source
      uses: actions/upload-artifact@v7.0.1
      with:
        name: source-${{ env.CURRENT_TIME }}-${{ env.SHORT_SHA }}
        retention-days: 5
        path: |
          ./**/*.*
          !./.git
          # Doesn't work :-( !/.git
          # Doesn't work :-( !/.git/**/*.*

    - name: "Sets production API keys"
      if: github.event.inputs.productionApiKeys == 'true'
      run: |
        echo "Set production API keys" 
        echo "BUILD_TYPE=production" >> $env:GITHUB_ENV
        echo "GRAPH_CLIENT_ID=${{ secrets.GRAPH_CLIENT_ID_PRODUCTION }}" >> $env:GITHUB_ENV
        echo "IS_TEST_ENVIRONMENT=false" >> $env:GITHUB_ENV

    - name: "Sets test API keys"
      if: github.event.inputs.productionApiKeys != 'true'
      run: |
        echo "Set test API keys" 
        echo "BUILD_TYPE=test" >> $env:GITHUB_ENV
        echo "GRAPH_CLIENT_ID=${{ secrets.GRAPH_CLIENT_ID_TEST }}" >> $env:GITHUB_ENV
        echo "IS_TEST_ENVIRONMENT=true" >> $env:GITHUB_ENV

    - name: "Creating secrets file"
      run: |
        echo "namespace Pekspro.RadioStorm.Settings.SynchronizedSettings.FileProvider.Secrets;" >> $env:SECRETS_FILE
        echo "public static partial class Secrets" >> $env:SECRETS_FILE
        echo "{" >> $env:SECRETS_FILE
        echo "    static partial void Initialize()" >> $env:SECRETS_FILE
        echo "    {" >> $env:SECRETS_FILE
        echo "        GraphClientId = ""${{ env.GRAPH_CLIENT_ID }}"";" >> $env:SECRETS_FILE
        echo "        IsTestEnvironment = ${{ env.IS_TEST_ENVIRONMENT }};" >> $env:SECRETS_FILE
        echo "    }" >> $env:SECRETS_FILE
        echo "}" >> $env:SECRETS_FILE

    - name: Output settings
      run: |
        echo "Is test: ${{ env.IS_TEST_ENVIRONMENT }}"
        echo "Build type: ${{ env.BUILD_TYPE }}"
        echo "Build setting: ${{ github.event.inputs.productionApiKeys }}"
        echo "Build time string: ${{ env.CURRENT_TIME_UTC_STRING }}"

    - name: Set Windows build flag
      if: github.event.inputs.buildWindowsX86 == 'true' || github.event.inputs.buildWindowsX64 == 'true'
      run: echo "BUILD_WINDOWS=true" >> $env:GITHUB_ENV

    - name: Get Windows version
      if: env.BUILD_WINDOWS == 'true'
      id: windows_version
      uses: mavrosxristoforos/get-xml-info@2.0
      with:
        xml-file: Source/Pekspro.RadioStorm.MAUI/Platforms/Windows/Package.appxmanifest
        xpath: /*[local-name()='Package']/*[local-name()='Identity']/@Version

    - name: Print Windows version
      if: env.BUILD_WINDOWS == 'true'
      run: |
        echo "Windows version ${{ steps.windows_version.outputs.info }} will be built."

    - name: Create Windows certificate file
      if: env.BUILD_WINDOWS == 'true'
      uses: timheuer/base64-to-file@v2
      id: create_windows_certificate_file
      with:
        fileName: radiostorm.pfx
        encodedString: ${{ secrets.WINDOWS_KEY_FILE }}

    - name: Build MAUI for Windows x86
      if: github.event.inputs.buildWindowsX86 == 'true'
      run: dotnet publish ./Source/Pekspro.RadioStorm.MAUI/Pekspro.RadioStorm.MAUI.csproj --framework:net10.0-windows10.0.19041.0 --configuration:Release /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never /p:RuntimeIdentifier=win-x86 /p:UseMonoRuntime=false /p:AppxPackageSigningEnabled=false
      
    - name: Build MAUI for Windows x64
      if: github.event.inputs.buildWindowsX64 == 'true'
      run: dotnet publish ./Source/Pekspro.RadioStorm.MAUI/Pekspro.RadioStorm.MAUI.csproj --framework:net10.0-windows10.0.19041.0 --configuration:Release /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never /p:RuntimeIdentifier=win-x64 /p:UseMonoRuntime=false /p:AppxPackageSigningEnabled=false
  
    - name: Create Windows msixbundle
      if: env.BUILD_WINDOWS == 'true'
      shell: pwsh
      run: |
        $bundleName = "RadioStorm-${{ env.BUILD_TYPE }}-${{ steps.windows_version.outputs.info }}.msixbundle"
        echo "WINDOWS_BUNDLE_NAME=$bundleName" >> $env:GITHUB_ENV

        # Collect the per-architecture app packages, excluding framework dependency packages.
        $packageFolder = "./WindowsPackages"
        New-Item -ItemType Directory -Force -Path $packageFolder | Out-Null
        Get-ChildItem -Path ./Source/Pekspro.RadioStorm.MAUI/AppPackages -Recurse -Filter *.msix |
          Where-Object { $_.FullName -notmatch '\\Dependencies\\' } |
          Copy-Item -Destination $packageFolder -Force

        # Locate makeappx.exe from the latest installed Windows SDK.
        $makeappx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
        echo "Using makeappx: $makeappx"

        & $makeappx bundle /d $packageFolder /bv ${{ steps.windows_version.outputs.info }} /p "./$bundleName"
        if ($LASTEXITCODE -ne 0) { throw "makeappx failed with exit code $LASTEXITCODE" }

    - name: Sign Windows msixbundle
      if: env.BUILD_WINDOWS == 'true'
      shell: pwsh
      run: |
        $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
        echo "Using signtool: $signtool"

        & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "${{ steps.create_windows_certificate_file.outputs.filePath }}" /p "${{ secrets.WINDOWS_KEY_PASSWORD }}" "./${{ env.WINDOWS_BUNDLE_NAME }}"
        if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }

        # Export the public certificate so the signed bundle can be sideloaded.
        $securePassword = ConvertTo-SecureString -String "${{ secrets.WINDOWS_KEY_PASSWORD }}" -AsPlainText -Force
        $certificate = Get-PfxCertificate -FilePath "${{ steps.create_windows_certificate_file.outputs.filePath }}" -Password $securePassword
        Export-Certificate -Cert $certificate -FilePath "./RadioStorm.cer" -Type CERT | Out-Null

    - name: Upload Windows Artifact
      if: env.BUILD_WINDOWS == 'true'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: windows-${{ env.BUILD_TYPE }}-${{ env.CURRENT_TIME }}-${{ env.SHORT_SHA }}-${{ steps.windows_version.outputs.info }}
        retention-days: 5
        path: |
          ./*.msix
          ./*.msixbundle
          ./*.cer


    - name: Get Android display version
      id: android_display_version
      if: github.event.inputs.buildAndroid == 'true'
      uses: mavrosxristoforos/get-xml-info@2.1.0
      with:
        xml-file: Source/Pekspro.RadioStorm.MAUI/Pekspro.RadioStorm.MAUI.csproj
        xpath: /Project/PropertyGroup/ApplicationDisplayVersion

    - name: Get Android version
      id: android_version
      if: github.event.inputs.buildAndroid == 'true'
      uses: mavrosxristoforos/get-xml-info@2.1.0
      with:
        xml-file: Source/Pekspro.RadioStorm.MAUI/Pekspro.RadioStorm.MAUI.csproj
        xpath: /Project/PropertyGroup/ApplicationVersion

    - name: Print Android version
      if: github.event.inputs.buildAndroid == 'true'
      run: |
        echo "Android version ${{ steps.android_display_version.outputs.info }} (${{ steps.android_version.outputs.info }}) will be built."

    - name: Create Android key file
      if: github.event.inputs.buildAndroid == 'true'
      uses: timheuer/base64-to-file@v2
      id: create_android_key_file
      with:
        fileName: androidkeyfile
        encodedString: ${{ secrets.ANDROID_KEY_FILE }}
     
    - name: Build MAUI for Android
      if: github.event.inputs.buildAndroid == 'true'
      run: dotnet publish ./Source/Pekspro.RadioStorm.MAUI/Pekspro.RadioStorm.MAUI.csproj --framework:net10.0-android --configuration:Release /p:AndroidSigningKeyStore=${{ steps.create_android_key_file.outputs.filePath }} /p:AndroidKeyStore=True /p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} /p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }} /p:AndroidSigningStorePass=${{ secrets.ANDROID_KEY_PASSWORD }} /p:PublishTrimmed=false /p:RunAOTCompilation=false --output ./Android

    - name: Delete AAB-files
      if: github.event.inputs.buildAndroid == 'true' && github.event.inputs.androidKeepAab == 'false'
      run: |
         del ./Android/*.aab

    - name: Move Android outputs to root folder
      if: github.event.inputs.buildAndroid == 'true'
      run: |
         mv ./Android/*.* ./

    - name: Add version to file name
      if: github.event.inputs.buildAndroid == 'true'
      shell: powershell 
      run: |
         Get-ChildItem -Filter *.aab | Rename-Item -NewName { $_.BaseName + '-${{ env.SHORT_SHA }}-${{ steps.android_display_version.outputs.info }} [${{ steps.android_version.outputs.info }}]' + $_.Extension }
         Get-ChildItem -Filter *.apk | Rename-Item -NewName { $_.BaseName + '-${{ env.SHORT_SHA }}-${{ steps.android_display_version.outputs.info }} [${{ steps.android_version.outputs.info }}]' + $_.Extension }

    - name: Upload a Android Artifact
      if: github.event.inputs.buildAndroid == 'true'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: android-${{ env.BUILD_TYPE }}-${{ env.CURRENT_TIME }}-${{ env.SHORT_SHA }}-${{ steps.android_display_version.outputs.info }} [${{ steps.android_version.outputs.info }}]
        retention-days: 5
        path: |
          ./*.aab
          ./*.apk
